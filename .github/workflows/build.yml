name: Build Telegram Backup APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    # تنزيل ملفات TDLib و TdApi.java و Client.java الصحيحة مباشرة
    - name: Setup TDLib Native & Java Classes
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        mkdir -p app/src/main/java/org/drinkless/tdlib

        # 1. تنزيل مكتبات الـ C++ Native
        curl -L -o app/src/main/jniLibs/arm64-v8a/libtdjni.so https://github.com/upx7/tdlib-android/releases/download/v1.8.0/arm64-v8a_libtdjni.so
        curl -L -o app/src/main/jniLibs/armeabi-v7a/libtdjni.so https://github.com/upx7/tdlib-android/releases/download/v1.8.0/armeabi-v7a_libtdjni.so

        # 2. تنزيل ملفات جافا الأصلية الخاصة بـ TdApi و Client
        curl -L -o app/src/main/java/org/drinkless/tdlib/Client.java https://raw.githubusercontent.com/upx7/tdlib-android/v1.8.0/tdlib/src/main/java/org/drinkless/tdlib/Client.java
        curl -L -o app/src/main/java/org/drinkless/tdlib/TdApi.java https://raw.githubusercontent.com/upx7/tdlib-android/v1.8.0/tdlib/src/main/java/org/drinkless/tdlib/TdApi.java

    - name: Inject Telegram Secrets
      run: |
        echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}" >> local.properties
        echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties

    - name: Build Android Debug APK
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Telegram-Backup-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
